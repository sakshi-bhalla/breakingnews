name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: breakingnews
      coverage-floor: 0
      # py-canon defaults to ["3.11", "3.14"], but this project caps at <3.14
      # because the gpu extra needs torch, which has no 3.14 wheels. The 3.14
      # leg therefore fails at `uv sync`, not at anything we wrote. Track the
      # real ceiling instead, and raise it when torch ships 3.14.
      python-versions: '["3.11", "3.13"]'
