# PLACEHOLDER. This file exists only so the package is importable while the
# core modules are written. It will be REPLACED by `preen new` / `preen adopt`,
# which owns the py-canon [tool.*] blocks, the hatchling + uv-dynamic-versioning
# backend, and tag-derived versioning. Do not add fleet config here.
[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "breakingnews"
description = "Story segmentation for broadcast-news transcripts"
readme = "README.md"
# Upper bound deviates from the fleet standard deliberately: the inference
# extra needs torch, which has no 3.14 wheels, so an unbounded floor-to-
# ceiling CI matrix cannot pass. Revisit when torch ships 3.14.
requires-python = ">=3.11,<3.14"
# NOTE: `preen adopt` / `copier update` fills this with the template's default
# author. Restore this single entry after any template sync.
authors = [{ name = "Sakshi Bhalla" }]
license = "MIT"
license-files = ["LICENSE"]
# huggingface-hub only: `check-adapter` resolves a Hub id and is advertised
# as running without the gpu extra. Small, pure-Python, no torch.
dependencies = ["huggingface-hub>=0.25"]
dynamic = ["version"]

[project.scripts]
breakingnews = "breakingnews.cli:main"

# torch/transformers/peft are an extra rather than a hard dependency: the
# metrics and post-processing half of the package is pure Python and should
# install on a laptop without a 2 GB download.
[project.optional-dependencies]
gpu = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "safetensors>=0.4",
  "accelerate>=0.34",
]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "pyright>=1.1.390",
  "pydoclint>=0.5",
  "codespell",
  { include-group = "test" },
  { include-group = "typing" },
  "pytest>=8",
]
# The inference stack is an extra for users, but type checking and CI must be
# able to resolve the lazy `import torch` inside loading.py and segmenter.py.
typing = ["torch>=2.4", "transformers>=4.45", "peft>=0.13", "safetensors>=0.4"]
test = ["pytest>=8", "pytest-cov>=6", "jsonschema>=4"]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
# Without these, pyright does not resolve the repo's own environment and
# reports the optional inference imports as missing. Naming the venv makes
# `pyright src/breakingnews` work however it is invoked, not only under
# `uv run`.
# NOTE: `preen adopt` / `copier update` rewrites [tool.pyright]; restore these
# after any template sync.
venvPath = "."
venv = ".venv"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.hatch.build.targets.wheel]
packages = ["src/breakingnews"]

[tool.hatch.version]
source = "uv-dynamic-versioning"
[tool.ruff]
line-length = 88
target-version = "py311"
# scripts/model-training/ is a verbatim copy of the code that produced the
# published numbers. Linting or formatting it would destroy the only property
# that makes it worth shipping, so it is excluded on purpose.
# NOTE: `preen adopt` / `copier update` drops this -- restore it after any sync.
extend-exclude = ["scripts/model-training"]

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "D206", "D300", "W191"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
"scripts/**" = ["T20"]
"**/cli.py" = ["T20"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
