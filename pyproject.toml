# PLACEHOLDER. This file exists only so the package is importable while the
# core modules are written. It will be REPLACED by `preen new` / `preen adopt`,
# which owns the py-canon [tool.*] blocks, the hatchling + uv-dynamic-versioning
# backend, and tag-derived versioning. Do not add fleet config here.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breakingnews"
version = "0.0.0.dev0"
description = "Story segmentation for broadcast-news transcripts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
breakingnews = "breakingnews.cli:main"

# torch/transformers/peft are an extra rather than a hard dependency: the
# metrics and post-processing half of the package is pure Python and should
# install on a laptop without a 2 GB download.
[project.optional-dependencies]
gpu = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "safetensors>=0.4",
  "huggingface-hub>=0.25",
  "accelerate>=0.34",
]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "pyright>=1.1.390",
  "pydoclint>=0.5",
  "codespell",
  { include-group = "test" },
  { include-group = "typing" },
]
# The inference stack is an extra for users, but type checking and CI must be
# able to resolve the lazy `import torch` inside loading.py and segmenter.py.
typing = ["torch>=2.4", "transformers>=4.45", "peft>=0.13", "safetensors>=0.4"]
test = ["pytest>=8", "pytest-cov>=6", "jsonschema>=4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|scripts'


[tool.hatch.build.targets.wheel]
packages = ["src/breakingnews"]

# scripts/model-training/ is verbatim research code that produced the published
# numbers. Linting or formatting it would destroy the only property that makes
# it worth shipping. preen/py-canon will own the rest of [tool.ruff]; this
# exclusion must survive adoption.
[tool.ruff]
line-length = 88
extend-exclude = ["scripts/model-training"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
  "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY", "RSE",
  "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "SLF", "S101", "D100", "D101", "D102", "D103"]
"scripts/**" = ["T20"]
"**/cli.py" = ["T20"]
